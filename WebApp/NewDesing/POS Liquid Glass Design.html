document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:blur(90px); opacity:0.45; pointer-events:none;\"><\u002Fdiv>\n  <div style=\"position:fixed; bottom:-12%; right:-6%; width:560px; height:560px; border-radius:50%; background:oklch(0.85 0.12 330); filter:blur(100px); opacity:0.35; pointer-events:none;\"><\u002Fdiv>\n  <div style=\"position:fixed; top:35%; right:18%; width:380px; height:380px; border-radius:50%; background:oklch(0.86 0.1 190); filter:blur(90px); opacity:0.3; pointer-events:none;\"><\u002Fdiv>\n\n  <div style=\"position:fixed; top:24px; right:24px; z-index:100; display:flex; flex-direction:column; gap:10px; width:320px;\">\n    <sc-for list=\"{{ toasts }}\" as=\"t\" hint-placeholder-count=\"0\">\n      <div class=\"gtoast\" style=\"display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px; background:rgba(255,255,255,0.85); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.9); box-shadow:0 10px 28px rgba(60,70,140,0.18);\">\n        <span class=\"gicon\" style=\"font-size:20px; color:{{ t.iconColor }};\">{{ t.icon }}<\u002Fspan>\n        <div style=\"flex:1; font-size:13px; font-weight:600; color:oklch(0.25 0.02 258);\">{{ t.message }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;\">\n      <div style=\"width:400px; background:rgba(255,255,255,0.6); backdrop-filter:blur(28px); border:1px solid rgba(255,255,255,0.75); border-radius:26px; padding:40px; box-shadow:0 20px 60px rgba(80,90,140,0.18); display:flex; flex-direction:column; gap:16px;\">\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:8px;\">\n          <div style=\"width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg, oklch(0.62 0.16 258), oklch(0.55 0.17 280)); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(70,80,180,0.3);\">\n            <span class=\"gicon\" style=\"font-size:28px; color:white;\">point_of_sale<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:20px; font-weight:800; color:oklch(0.22 0.02 258);\">เข้าสู่ระบบ POS<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:oklch(0.5 0.02 258);\">Point of Sale · Liquid Glass<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:6px;\">\n          <label style=\"font-size:12px; font-weight:700; color:oklch(0.4 0.02 258);\">ชื่อผู้ใช้ / Username<\u002Flabel>\n          <input value=\"{{ loginUsername }}\" sc-camel-on-change=\"{{ onLoginUsername }}\" placeholder=\"ชื่อผู้ใช้งาน\" style=\"padding:13px 16px; border-radius:13px; border:1px solid rgba(120,120,160,0.25); background:rgba(255,255,255,0.7); font-size:14px; color:oklch(0.22 0.02 258);\">\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px;\">\n          <label style=\"font-size:12px; font-weight:700; color:oklch(0.4 0.02 258);\">รหัสผ่าน / Password<\u002Flabel>\n          <input type=\"password\" value=\"{{ loginPassword }}\" sc-camel-on-change=\"{{ onLoginPassword }}\" sc-camel-on-key-down=\"{{ onLoginKeyDown }}\" placeholder=\"••••••\" style=\"padding:13px 16px; border-radius:13px; border:1px solid rgba(120,120,160,0.25); background:rgba(255,255,255,0.7); font-size:14px; color:oklch(0.22 0.02 258);\">\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasLoginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12.5px; font-weight:700; color:oklch(0.5 0.18 25);\">{{ loginError }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-top:2px;\">\n          <label style=\"display:flex; align-items:center; gap:8px; font-size:12.5px; color:oklch(0.45 0.02 258); cursor:pointer;\">\n            <input type=\"che  14px; border-radius:12px; border:1px solid rgba(120,120,160,0.25); background:rgba(255,255,255,0.7); font-size:14px;\">\n        <div style=\"padding:14px; text-align:center; border-radius:14px; background:linear-gradient(135deg, oklch(0.62 0.16 258), oklch(0.55 0.17 280)); color:white; font-weight:700; cursor:pointer; margin-top:6px; box-shadow:0 6px 16px rgba(70,80,180,0.28);\" sc-camel-on-click=\"{{ saveNewCategory }}\">บันทึกหมวดหมู่<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CASH MODAL -->\n  <sc-if value=\"{{ isCashModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(30,30,50,0.35); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:50;\" sc-camel-on-click=\"{{ closePayment }}\">\n      <div style=\"width:380px; background:rgba(255,255,255,0.85); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.9); border-radius:24px; padding:28px; box-shadow:0 20px 60px rgba(60,70,140,0.25);\" sc-camel-on-click=\"{{ stopClick }}\">\n        <div style=\"font-size:17px; font-weight:800; color:oklch(0.22 0.02 258); margin-bottom:4px;\">รับชำระเงินสด<\u002Fdiv>\n        <div style=\"font-size:13px; color:oklch(0.5 0.02 258); margin-bottom:18px;\">ยอดที่ต้องชำระ <strong>{{ totalLabel }}<\u002Fstrong><\u002Fdiv>\n        <input value=\"{{ cashReceived }}\" sc-camel-on-change=\"{{ onCashInput }}\" placeholder=\"จำนวนเงินที่รับ\" style=\"width:100%; padding:14px 16px; border-radius:14px; border:1px solid rgba(120,120,160,0.25); background:rgba(255,255,255,0.7); font-size:18px; font-weight:700; color:oklch(0.22 0.02 258); margin-bottom:12px;\">\n        <div style=\"display:flex; gap:8px; margin-bottom:16px;\">\n          <sc-for list=\"{{ quickCashOptions }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <div style=\"flex:1; text-align:center; padding:8px 4px; border-radius:10px; background:rgba(120,120,160,0.1); font-size:12px; font- ter:blur(30px); border:1px solid rgba(255,255,255,0.9); border-radius:24px; padding:28px; text-align:center; box-shadow:0 20px 60px rgba(60,70,140,0.25);\" sc-camel-on-click=\"{{ stopClick }}\">\n        <div style=\"font-size:17px; font-weight:800; color:oklch(0.22 0.02 258); margin-bottom:6px;\">สแกน QR เพื่อชำระเงิน<\u002Fdiv>\n        <div style=\"font-size:13px; color:oklch(0.5 0.02 258); margin-bottom:18px;\">ยอดชำระ <strong>{{ totalLabel }}<\u002Fstrong><\u002Fdiv>\n        <div style=\"width:200px; height:200px; margin:0 auto 18px; border-radius:16px; background:repeating-linear-gradient(45deg, oklch(0.2 0 0), oklch(0.2 0 0) 6px, white 6px, white 12px); display:flex; align-items:center; justify-content:center;\">\n          <div style=\"width:170px; height:170px; background:white; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:11px; color:oklch(0.4 0.02 258);\">QR PROMPTPAY<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ paymentProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px; border-radius:14px; background:oklch(0.65 0.1 258); color:white; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;\">\n            <span class=\"gicon gspinner\" style=\"font-size:18px;\">progress_activity<\u002Fspan>กำลังตรวจสอบการชำระเงิน...\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ qrNotProcessing }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:14px; border-radius:14px; background:linear-gradient(135deg, oklch(0.62 0.16 258), oklch(0.55 0.17 280)); color:white; font-weight:700; cursor:pointer; box-shadow:0 6px 16px rgba(70,80,180,0.28);\" sc-camel-on-click=\"{{ confirmQr }}\">ยืนยันการชำระเงินแล้ว<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ADD PRODUCT MODAL -->\n  <sc-if value=\"{{ isAddProductModal }}\" hint- e: 'เลมอนเนด', nameEn: 'Lemonade', price: 55, categoryId: 'cold', status: 'Active', barcode: '8850001000126' },\n  { id: 'p13', name: 'ครัวซองต์เนย', nameEn: 'Butter Croissant', price: 55, categoryId: 'bakery', status: 'Active', barcode: '8850001000133' },\n  { id: 'p14', name: 'มัฟฟินช็อกโกแลต', nameEn: 'Chocolate Muffin', price: 50, categoryId: 'bakery', status: 'Active', barcode: '8850001000140' },\n  { id: 'p15', name: 'บานาน่าเบรด', nameEn: 'Banana Bread', price: 45, categoryId: 'bakery', status: 'Active', barcode: '8850001000157' },\n  { id: 'p16', name: 'ชีสเค้ก', nameEn: 'Cheesecake Slice', price: 85, categoryId: 'bakery', status: 'Active', barcode: '8850001000164' },\n  { id: 'p17', name: 'ซินนามอนโรล', nameEn: 'Cinnamon Roll', price: 60, categoryId: 'bakery', status: 'Active', barcode: '8850001000171' },\n  { id: 'p18', name: 'มันฝรั่งทอดกรอบ', nameEn: 'Potato Chips', price: 35, categoryId: 'snack', status: 'Inactive', barcode: '8850001000188' },\n  { id: 'p19', name: 'คุกกี้', nameEn: 'Cookies', price: 40, categoryId: 'snack', status: 'Inactive', barcode: '8850001000195' },\n];\n\nconst HISTORY = [\n  { id: 'ORD-1049', time: '14:32', payment: 'QR พร้อมเพย์', items: [{ name: 'ลาเต้เย็น', qty: 2, price: 65 }, { name: 'ครัวซองต์เนย', qty: 1, price: 55 }] },\n  { id: 'ORD-1048', time: '13:58', payment: 'เงินสด', items: [{ name: 'อเมริกาโน่ร้อน', qty: 1, price: 50 }] },\n  { id: 'ORD-1047', time: '13:20', payment: 'เงินสด', items: [{ name: 'ชาไทยเย็น', qty: 3, price: 50 }, { name: 'ชีสเค้ก', qty: 1, price: 85 }] },\n  { id: 'ORD-1046', time: '12:45', payment: 'QR พร้อมเพย์', items: [{ name: 'คาปูชิโน่', qty: 2, price: 60 }, { name: 'มัฟฟินช็อกโกแลต', qty: 2, price: 50 }] },\n  { id: 'ORD-1045', time: '11:52', payment: 'เงินสด', items: [{ name: 'โคลด์บรูว์', qty: 1, price: 70 }] },\n  { id: 'ORD-1044', time: '10:15', payment: 'QR พร้อมเพย์', items: [{ name: 'มอคค่า', qty: 1, price: 65 }, { name: 'ซินนามอนโรล', qty: 1, price: 60 }] },\n];\n\nfunction baht(n) { return '฿' + n.toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }\nfunction orderTotals(items) {\n  const subtotal = items.reduce((s, i) => s + i.qty * i.price, 0);\n  const vat = subtotal - subtotal / 1.07; // VAT already included in listed prices — informational only\n  return { subtotal, vat, total: subtotal };\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'login',\n    loginCompanyCode: '',\n    loginUsername: '',\n    loginPassword: '',\n    loginError: '',\n    rememberMe: false,\n    categories: CATEGORIES,\n    activeCategory: 'all',\n    products: PRODUCTS,\n    cart: [],\n    paymentModalOpen: null,\n    cashReceived: '',\n    history: HISTORY,\n    selectedOrderId: null,\n    showAddProduct: false,\n    newProduct: { nameTh: '', nameEn: '', categoryId: 'hot', price: '', imageUrl: '', imageUrlInput: '' },\n    nextOrderNum: 1050,\n    barcodeInput: '',\n    barcodeError: '',\n    importMessage: '',\n    storeName: '',\n    storeSavedMessage: '',\n    showAddCategory: false,\n    newCategory: { nameTh: '', nameEn: '' },\n    productsPage: 1,\n    historyPage: 1,\n    loginLoading: false,\n    paymentProcessing: false,\n    toasts: [],\n  };\n  toastSeq = 1;\n\n  pageSize = 8;\n\n  barcodeRef = React.createRef();\n  barcodeErrorTimer = null;\n  importFileRef = React.createRef();\n  importMsgTimer = null;\n  newProductFileRef = React.createRef();\n\n  triggerImport() { if (this.importFileRef.current) this.importFileRef.current.click(); }\n\n  exportExcel() {\n    const catNameById = {};\n    this.state.categories.forEach(c => catNameById[c.id] = c.name);\n    const header = ['ชื่อสินค้า', 'Product Name (EN)', 'หมวดหมู่', 'ราคา', 'สถานะ'];\n    const rows = this.state.products.map(p => [p.name, p.nameEn, catNameById[p.categoryId] || '', p.price, p.status]);\n    const csv = [header, ...rows].map(r => r.map(v => '\"' + String(v).replace(/\"/g, '\"\"') + '\"').join(',')).join('\\r\\n');\n    const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = 'products.csv';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    URL.revokeObjectURL(url);\n  }\n\n  showImportMessage(msg) { this.addToast(msg, 'success'); }\n\n  onImportFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = (ev) => {\n      const text = String(ev.target.result || '');\n      const lines = text.split(/\\r?\\n/).filter(l => l.trim().length > 0);\n      const parseLine = (line) => {\n        const out = []; let cur = ''; let inQ = false;\n        for (let i = 0; i < line.length; i++) {\n          const ch = line[i];\n          if (inQ) {\n            if (ch === '\"' && line[i + 1] === '\"') { cur += '\"'; i++; }\n            else if (ch === '\"') { inQ = false; }\n            else cur += ch;\n          } else {\n            if (ch === '\"') inQ = true;\n            else if (ch === ',') { out.push(cur); cur = ''; }\n            else cur += ch;\n          }\n        }\n        out.push(cur);\n        return out;\n      };\n      const dataLines = lines.slice(1);\n      const catIdByName = {};\n      this.state.categories.forEach(c => { catIdByName[c.name] = c.id; catIdByName[c.nameEn] = c.id; });\n      const imported = dataLines.map((line, idx) => {\n        const cols = parseLine(line);\n        const [nameTh, nameEn, catName, price, status] = cols;\n        return {\n          id: 'imp' + Date.now() + '_' + idx,\n          name: (nameTh || '').trim(), nameEn: (nameEn || '').trim(),\n          categoryId: catIdByName[(catName || '').trim()] || this.state.categories[0].id,\n          price: parseFloat(price) || 0,\n          status: (status || '').trim() === 'Inactive' ? 'Inactive' : 'Active',\n        };\n      }).filter(p => p.name);\n      this.setState(s => ({ products: [...s.products, ...imported] }));\n      this.showImportMessage('นำเข้าสำเร็จ ' + imported.length + ' รายการ');\n    };\n    reader.readAsText(file);\n    e.target.value = '';\n  }\n\n  componentDidMount() { this.focusBarcode(); }\n  componentDidUpdate() { this.focusBarcode(); }\n  focusBarcode() {\n    if (this.state.view === 'pos' && this.barcodeRef.current && document.activeElement !== this.barcodeRef.current) {\n      this.barcodeRef.current.focus();\n    }\n  }\n\n  scanBarcode(code) {\n    const trimmed = (code || '').trim();\n    if (!trimmed) return;\n    const product = this.state.products.find(p => p.barcode === trimmed);\n    const catActive = product && this.state.categories.find(c => c.id === product.categoryId && c.status === 'Active');\n    if (product && product.status === 'Active' && catActive) {\n      this.addToCart(product);\n      this.setState({ barcodeInput: '', barcodeError: '' });\n    } else {\n      this.setState({ barcodeInput: '', barcodeError: 'ไม่พบสินค้าสำหรับบาร์โค้ดนี้' });\n      clearTimeout(this.barcodeErrorTimer);\n      this.barcodeErrorTimer = setTimeout(() => this.setState({ barcodeError: '' }), 2500);\n      this.addToast('ไม่พบสินค้าสำหรับบาร์โค้ดนี้', 'error');\n    }\n  }\n\n  setView(v) { this.setState({ view: v }); }\n\n  addToast(message, type) {\n    const id = this.toastSeq++;\n    const icon = type === 'error' ? 'error' : type === 'info' ? 'info' : 'check_circle';\n    const iconColor = type === 'error' ? 'oklch(0.55 0.18 25)' : type === 'info' ? 'oklch(0.55 0.14 258)' : 'oklch(0.5 0.14 155)';\n    this.setState(s => ({ toasts: [...s.toasts, { id, message, icon, iconColor }] }));\n    setTimeout(() => this.setState(s => ({ toasts: s.toasts.filter(t => t.id !== id) })), 3200);\n  }\n\n  handleLogin() {\n    const s = this.state;\n    if (!s.loginUsername.trim() || !s.loginPassword.trim()) {\n      this.setState({ loginError: 'กรุณากรอกข้อมูลให้ครบทุกช่อง' });\n      return;\n    }\n    this.setState({ loginLoading: true, loginError: '' });\n    setTimeout(() => {\n      this.setState({ view: 'pos', loginLoading: false, loginPassword: '' });\n      this.addToast('เข้าสู่ระบบสำเร็จ', 'success');\n    }, 700);\n  }\n  handleLogout() { this.setState({ view: 'login', loginPassword: '' }); }\n  selectCategory(id) { this.setState({ activeCategory: id }); }\n\n  addToCart(product) {\n    this.setState(s => {\n      const existing = s.cart.find(i => i.id === product.id);\n      if (existing) {\n        return { cart: s.cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i) };\n      }\n      return { cart: [...s.cart, { id: product.id, name: product.name, price: product.price, qty: 1 }] };\n    });\n  }\n  incQty(id) { this.setState(s => ({ cart: s.cart.map(i => i.id === id ? { ...i, qty: i.qty + 1 } : i) })); }\n  decQty(id) { this.setState(s => ({ cart: s.cart.map(i => i.id === id ? { ...i, qty: i.qty - 1 } : i).filter(i => i.qty > 0) })); }\n  removeFromCart(id) { this.setState(s => ({ cart: s.cart.filter(i => i.id !== id) })); }\n\n  openPayment(method) { this.setState({ paymentModalOpen: method, cashReceived: '' }); }\n  closePayment() { this.setState({ paymentModalOpen: null, cashReceived: '' }); }\n\n  completeOrder(payment) {\n    const items = this.state.cart.map(i => ({ name: i.name, qty: i.qty, price: i.price }));\n    const now = new Date();\n    const time = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });\n    const order = { id: 'ORD-' + this.state.nextOrderNum, time, payment, items };\n    this.setState(s => ({\n      history: [order, ...s.history],\n      nextOrderNum: s.nextOrderNum + 1,\n      cart: [],\n      paymentModalOpen: null,\n      cashReceived: '',\n      paymentProcessing: false,\n    }));\n    this.addToast('ชำระเงินสำเร็จ ' + order.id, 'success');\n  }\n  confirmCash() {\n    const { total } = orderTotals(this.state.cart);\n    if (parseFloat(this.state.cashReceived || '0') >= total) {\n      this.setState({ paymentProcessing: true });\n      setTimeout(() => this.completeOrder('เงินสด'), 900);\n    }\n  }\n  confirmQr() {\n    this.setState({ paymentProcessing: true });\n    setTimeout(() => this.completeOrder('QR พร้อมเพย์'), 900);\n  }\n\n  selectOrder(id) { this.setState({ selectedOrderId: id }); }\n  closeReceipt() { this.setState({ selectedOrderId: null }); }\n\n  toggleProductStatus(id) {\n    this.setState(s => ({ products: s.products.map(p => p.id === id ? { ...p, status: p.status === 'Active' ? 'Inactive' : 'Active' } : p) }));\n  }\n  toggleCategoryStatus(id) {\n    this.setState(s => ({ categories: s.categories.map(c => c.id === id ? { ...c, status: c.status === 'Active' ? 'Inactive' : 'Active' } : c) }));\n  }\n  deleteProduct(id) { this.setState(s => ({ products: s.products.filter(p => p.id !== id) })); }\n  deleteCategory(id) { this.setState(s => ({ categories: s.categories.filter(c => c.id !== id) })); }\n\n  saveStoreInfo() { this.addToast('บันทึกข้อมูลร้านเรียบร้อย', 'success'); }\n\n  openAddCategory() { this.setState({ showAddCategory: true, newCategory: { nameTh: '', nameEn: '' } }); }\n  closeAddCategory() { this.setState({ showAddCategory: false }); }\n  saveNewCategory() {\n    const nc = this.state.newCategory;\n    if (!nc.nameTh) return;\n    const category = { id: 'c' + Date.now(), name: nc.nameTh, nameEn: nc.nameEn || nc.nameTh, status: 'Active' };\n    this.setState(s => ({ categories: [...s.categories, category], showAddCategory: false }));\n    this.addToast('เพิ่มหมวดหมู่ \"' + category.name + '\" สำเร็จ', 'success');\n  }\n\n  openAddProduct() { this.setState({ showAddProduct: true, newProduct: { nameTh: '', nameEn: '', categoryId: 'hot', price: '', imageUrl: '', imageUrlInput: '' } }); }\n  closeAddProduct() { this.setState({ showAddProduct: false }); }\n  saveNewProduct() {\n    const np = this.state.newProduct;\n    if (!np.nameTh || !np.price) return;\n    const product = { id: 'p' + Date.now(), name: np.nameTh, nameEn: np.nameEn || np.nameTh, price: parseFloat(np.price) || 0, categoryId: np.categoryId, status: 'Active', image: np.imageUrl || '' };\n    this.setState(s => ({ products: [...s.products, product], showAddProduct: false }));\n    this.addToast('เพิ่มสินค้า \"' + product.name + '\" สำเร็จ', 'success');\n  }\n  onNewProductFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = (ev) => this.setState(s => ({ newProduct: { ...s.newProduct, imageUrl: String(ev.target.result || ''), imageUrlInput: '' } }));\n    reader.readAsDataURL(file);\n    e.target.value = '';\n  }\n\n  renderVals() {\n    const s = this.state;\n    const view = s.view;\n    const activeCats = s.categories.filter(c => c.status === 'Active');\n\n    const posCategoryTabs = [{ id: 'all', name: 'ทั้งหมด' }, ...activeCats].map(c => ({\n      id: c.id, name: c.name, active: s.activeCategory === c.id, inactive: s.activeCategory !== c.id,\n      onClick: () => this.selectCategory(c.id),\n    }));\n\n    const catStatus = {};\n    s.categories.forEach(c => catStatus[c.id] = c.status);\n    const posProducts = s.products\n      .filter(p => p.status === 'Active' && catStatus[p.categoryId] === 'Active')\n      .filter(p => s.activeCategory === 'all' || p.categoryId === s.activeCategory)\n      .map(p => ({ id: p.id, name: p.name, nameEn: p.nameEn, priceLabel: baht(p.price), onAdd: () => this.addToCart(p) }));\n\n    const cartItems = s.cart.map(i => ({\n      id: i.id, name: i.name, qty: i.qty, priceLabel: baht(i.price) + ' / หน่วย',\n      lineTotalLabel: baht(i.qty * i.price),\n      onInc: () => this.incQty(i.id), onDec: () => this.decQty(i.id), onRemove: () => this.removeFromCart(i.id),\n    }));\n    const { subtotal, vat, total } = orderTotals(s.cart);\n    const cashReceivedNum = parseFloat(s.cashReceived || '0');\n    const change = cashReceivedNum - total;\n\n    const catNameById = {};\n    s.categories.forEach(c => catNameById[c.id] = c.name);\n\n    const mgmtCategories = s.categories.map(c => ({\n      name: c.name, isActive: c.status === 'Active', isInactive: c.status !== 'Active',\n      countLabel: s.products.filter(p => p.categoryId === c.id).length + ' รายการ',\n      onToggle: () => this.toggleCategoryStatus(c.id),\n    }));\n    const mgmtProductsAll = s.products.map(p => ({\n      id: p.id, imageId: 'prod-img-' + p.id, name: p.name, nameEn: p.nameEn, categoryName: catNameById[p.categoryId] || '-',\n      priceLabel: baht(p.price), isActive: p.status === 'Active', isInactive: p.status !== 'Active',\n      onToggle: () => this.toggleProductStatus(p.id), onDelete: () => this.deleteProduct(p.id),\n    }));\n    const productsPageCount = Math.max(1, Math.ceil(mgmtProductsAll.length / this.pageSize));\n    const productsPage = Math.min(s.productsPage, productsPageCount);\n    const mgmtProducts = mgmtProductsAll.slice((productsPage - 1) * this.pageSize, productsPage * this.pageSize);\n\n    const historyRowsAll = s.history.map(o => {\n      const { total } = orderTotals(o.items);\n      return {\n        id: o.id, time: o.time, payment: o.payment,\n        summary: o.items.map(i => i.name + ' x' + i.qty).join(', '),\n        totalLabel: baht(total), onSelect: () => this.selectOrder(o.id),\n      };\n    });\n    const historyPageCount = Math.max(1, Math.ceil(historyRowsAll.length / this.pageSize));\n    const historyPage = Math.min(s.historyPage, historyPageCount);\n    const historyRows = historyRowsAll.slice((historyPage - 1) * this.pageSize, historyPage * this.pageSize);\n    const selOrder = s.history.find(o => o.id === s.selectedOrderId);\n    let selectedOrder = null;\n    if (selOrder) {\n      const t = orderTotals(selOrder.items);\n      selectedOrder = {\n        id: selOrder.id, time: selOrder.time, payment: selOrder.payment,\n        items: selOrder.items.map(i => ({ name: i.name, qty: i.qty, lineTotalLabel: baht(i.qty * i.price) })),\n        subtotalLabel: baht(t.subtotal), vatLabel: baht(t.vat), totalLabel: baht(t.total),\n      };\n    }\n\n    const allTotals = s.history.map(o => orderTotals(o.items).total);\n    const todayTotal = allTotals.reduce((a, b) => a + b, 0);\n    const orderCount = s.history.length;\n    const avgTicket = orderCount ? todayTotal / orderCount : 0;\n\n    const qtyByName = {};\n    s.history.forEach(o => o.items.forEach(i => { qtyByName[i.name] = (qtyByName[i.name] || 0) + i.qty; }));\n    const topArr = Object.entries(qtyByName).sort((a, b) => b[1] - a[1]).slice(0, 4);\n    const maxQty = topArr.length ? topArr[0][1] : 1;\n    const topProducts = topArr.map(([name, qty]) => ({ name, qtyLabel: qty + ' แก้ว/ชิ้น', barWidth: Math.round((qty / maxQty) * 100) + '%' }));\n\n    const recentOrders = historyRowsAll.slice(0, 5);\n\n    return {\n      isLogin: view === 'login', isLoggedIn: view !== 'login',\n      loginCompanyCode: s.loginCompanyCode, loginUsername: s.loginUsername, loginPassword: s.loginPassword,\n      onLoginCompanyCode: (e) => this.setState({ loginCompanyCode: e.target.value }),\n      onLoginUsername: (e) => this.setState({ loginUsername: e.target.value }),\n      onLoginPassword: (e) => this.setState({ loginPassword: e.target.value }),\n      onLoginKeyDown: (e) => { if (e.key === 'Enter') this.handleLogin(); },\n      rememberMe: s.rememberMe, onRememberChange: (e) => this.setState({ rememberMe: e.target.checked }),\n      loginError: s.loginError, hasLoginError: !!s.loginError,\n      handleLogin: () => this.handleLogin(), handleLogout: () => this.handleLogout(),\n\n      toasts: s.toasts,\n      loginLoading: s.loginLoading, loginNotLoading: !s.loginLoading,\n      paymentProcessing: s.paymentProcessing, qrNotProcessing: !s.paymentProcessing,\n\n      isPos: view === 'pos', isPosInactive: view !== 'pos',\n      isProducts: view === 'products', isProductsInactive: view !== 'products',\n      isHistory: view === 'history', isHistoryInactive: view !== 'history',\n      isDashboard: view === 'dashboard', isDashboardInactive: view !== 'dashboard',\n      isSettings: view === 'settings', isSettingsInactive: view !== 'settings',\n      goPos: () => this.setView('pos'), goProducts: () => this.setView('products'),\n      goHistory: () => this.setView('history'), goDashboard: () => this.setView('dashboard'),\n      goSettings: () => this.setView('settings'),\n\n      storeName: s.storeName, onStoreNameChange: (e) => this.setState({ storeName: e.target.value }),\n      saveStoreInfo: () => this.saveStoreInfo(),\n      storeSavedMessage: s.storeSavedMessage, hasStoreSavedMessage: !!s.storeSavedMessage,\n      settingsCategories: s.categories.map(c => ({\n        name: c.name, isActive: c.status === 'Active', isInactive: c.status !== 'Active',\n        countLabel: s.products.filter(p => p.categoryId === c.id).length + ' รายการ',\n        onToggle: () => this.toggleCategoryStatus(c.id), onDelete: () => this.deleteCategory(c.id),\n      })),\n      isAddCategoryModal: s.showAddCategory,\n      openAddCategory: () => this.openAddCategory(), closeAddCategory: () => this.closeAddCategory(),\n      newCategory: s.newCategory,\n      onNewCategoryNameTh: (e) => this.setState(st => ({ newCategory: { ...st.newCategory, nameTh: e.target.value } })),\n      onNewCategoryNameEn: (e) => this.setState(st => ({ newCategory: { ...st.newCategory, nameEn: e.target.value } })),\n      saveNewCategory: () => this.saveNewCategory(),\n\n      posCategoryTabs, posProducts,\n      barcodeRef: this.barcodeRef,\n      barcodeInput: s.barcodeInput,\n      onBarcodeChange: (e) => this.setState({ barcodeInput: e.target.value }),\n      onBarcodeKeyDown: (e) => { if (e.key === 'Enter') this.scanBarcode(e.target.value); },\n      barcodeError: s.barcodeError, hasBarcodeError: !!s.barcodeError,\n      cartItems, cartEmpty: cartItems.length === 0, cartNotEmpty: cartItems.length > 0,\n      cartCountLabel: cartItems.reduce((a, i) => a + i.qty, 0) + ' ชิ้น',\n      subtotalLabel: baht(subtotal), vatLabel: baht(vat), totalLabel: baht(total),\n      openCashModal: () => this.openPayment('cash'), openQrModal: () => this.openPayment('qr'),\n      closePayment: () => this.closePayment(), stopClick: (e) => e && e.stopPropagation && e.stopPropagation(),\n\n      isCashModal: s.paymentModalOpen === 'cash', isQrModal: s.paymentModalOpen === 'qr',\n      cashReceived: s.cashReceived, onCashInput: (e) => this.setState({ cashReceived: e.target.value }),\n      changeLabel: change > 0 ? baht(change) : baht(0),\n      cashValid: cashReceivedNum >= total && total > 0 && !s.paymentProcessing,\n      cashInvalid: !(cashReceivedNum >= total && total > 0) && !s.paymentProcessing,\n      quickCashOptions: [\n        { label: 'พอดี', onClick: () => this.setState({ cashReceived: String(Math.ceil(total)) }) },\n        { label: '฿100', onClick: () => this.setState({ cashReceived: '100' }) },\n        { label: '฿500', onClick: () => this.setState({ cashReceived: '500' }) },\n        { label: '฿1000', onClick: () => this.setState({ cashReceived: '1000' }) },\n      ],\n      confirmCash: () => this.confirmCash(), confirmQr: () => this.confirmQr(),\n\n      mgmtCategories, mgmtProducts,\n      productsPageLabel: 'หน้า ' + productsPage + ' / ' + productsPageCount,\n      productsPrevDisabled: productsPage <= 1, productsNextDisabled: productsPage >= productsPageCount,\n      onProductsPrev: () => this.setState({ productsPage: Math.max(1, productsPage - 1) }),\n      onProductsNext: () => this.setState({ productsPage: Math.min(productsPageCount, productsPage + 1) }),\n      importFileRef: this.importFileRef,\n      triggerImport: () => this.triggerImport(),\n      onImportFile: (e) => this.onImportFile(e),\n      exportExcel: () => this.exportExcel(),\n      importMessage: s.importMessage, hasImportMessage: !!s.importMessage,\n      isAddProductModal: s.showAddProduct,\n      openAddProduct: () => this.openAddProduct(), closeAddProduct: () => this.closeAddProduct(),\n      newProduct: s.newProduct,\n      hasNewProductImage: !!s.newProduct.imageUrl, hasNoNewProductImage: !s.newProduct.imageUrl,\n      newProductImageCss: s.newProduct.imageUrl ? 'url(' + JSON.stringify(s.newProduct.imageUrl) + ')' : 'none',\n      newProductFileRef: this.newProductFileRef,\n      triggerNewProductFile: () => { if (this.newProductFileRef.current) this.newProductFileRef.current.click(); },\n      onNewProductFile: (e) => this.onNewProductFile(e),\n      onNewProductImageUrl: (e) => { const v = e.target.value; this.setState(st => ({ newProduct: { ...st.newProduct, imageUrlInput: v, imageUrl: v } })); },\n      onNewNameTh: (e) => this.setState(st => ({ newProduct: { ...st.newProduct, nameTh: e.target.value } })),\n      onNewNameEn: (e) => this.setState(st => ({ newProduct: { ...st.newProduct, nameEn: e.target.value } })),\n      onNewCategory: (e) => this.setState(st => ({ newProduct: { ...st.newProduct, categoryId: e.target.value } })),\n      onNewPrice: (e) => this.setState(st => ({ newProduct: { ...st.newProduct, price: e.target.value } })),\n      categoryOptions: s.categories.map(c => ({ id: c.id, name: c.name })),\n      saveNewProduct: () => this.saveNewProduct(),\n\n      historyRows, hasSelectedOrder: !!selectedOrder, selectedOrder, closeReceipt: () => this.closeReceipt(),\n      historyPageLabel: 'หน้า ' + historyPage + ' / ' + historyPageCount,\n      historyPrevDisabled: historyPage <= 1, historyNextDisabled: historyPage >= historyPageCount,\n      onHistoryPrev: () => this.setState({ historyPage: Math.max(1, historyPage - 1) }),\n      onHistoryNext: () => this.setState({ historyPage: Math.min(historyPageCount, historyPage + 1) }),\n\n      todayTotalLabel: baht(todayTotal), orderCountLabel: String(orderCount), avgTicketLabel: baht(avgTicket),\n      topProducts, recentOrders,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
