version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d pos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./WebAPI
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pos_user:pos_password@db:5432/pos_db
      # No pooler in front of the compose database, so migrations use the same URL.
      DIRECT_URL: postgresql://pos_user:pos_password@db:5432/pos_db
      JWT_SECRET: pos-jwt-secret-change-me
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"

  webapp:
    build:
      context: ./WebApp
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
